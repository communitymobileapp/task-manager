    function renderOverview(){const a=activeTasks(),open=a.filter(x=>x.status!=="done"),late=open.filter(x=>x.due&&x.due<today()),soon=open.filter(x=>x.due&&x.due>=today()&&x.due<="2026-10-21"),unassigned=open.filter(x=>!x.assignee),waiting=open.filter(x=>x.status==="waiting");const attention=[...late,...soon,...unassigned,...waiting].filter((x,i,z)=>z.findIndex(y=>y.id===x.id)===i).sort((x,y)=>(x.due||"").localeCompare(y.due||"")).slice(0,5);let ownerCounts=people.map(p=>({...p,count:open.filter(x=>x.assignee===p.name).length})).filter(x=>x.count).sort((a,b)=>b.count-a.count);const max=Math.max(1,...ownerCounts.map(x=>x.count));let acts=a.filter(x=>x.activity).slice().sort((x,y)=>y.created.localeCompare(x.created)).slice(0,4);return `${pageHead(t("hello"),t("overviewSub"))}<section class="grid kpis"><button class="kpi warn" data-kpi="late"><div class="kpi-top"><span>${esc(t("late"))}</span><span class="kpi-icon">!</span></div><div class="kpi-num">${late.length}</div><div class="kpi-hint">${esc(t("tasksInScope"))}</div></button><button class="kpi" data-kpi="soon"><div class="kpi-top"><span>${esc(t("dueSoon"))}</span><span class="kpi-icon">◷</span></div><div class="kpi-num">${soon.length}</div><div class="kpi-hint">${esc(t("comingUp"))}</div></button><button class="kpi" data-kpi="unassigned"><div class="kpi-top"><span>${esc(t("unassigned"))}</span><span class="kpi-icon">♙</span></div><div class="kpi-num">${unassigned.length}</div><div class="kpi-hint">${esc(t("needsAttention"))}</div></button><button class="kpi wait" data-kpi="waiting"><div class="kpi-top"><span>${esc(t("blocked"))}</span><span class="kpi-icon">Ⅱ</span></div><div class="kpi-num">${waiting.length}</div><div class="kpi-hint">${esc(t("needsAttention"))}</div></button></section><section class="grid dashboard-grid"><div class="panel"><div class="panel-head"><div><h2 class="panel-title">${esc(t("comingTasks"))}</h2><div class="panel-meta">${attention.length} ${esc(t("showing"))}</div></div><button class="s     function changeStatus(id,s){const x=state.tasks.find(t=>t.id===id);if(!x)return;x.status=s;x.activity=""+sLabel(s)+" · Előd frissítette az állapotot";x.updated=today();persist();toast(t("statusChanged"));render()}
    function openModal(html){document.getElementById("dialog").innerHTML=html;document.getElementById("modal").classList.add("open");document.body.style.overflow="hidden"}function closeModal(){document.getElementById("modal").classList.remove("open");document.body.style.overflow=""}
    function openForm(task=null){const x=task||{title:"",description:"",project:projects[0]?.name||"",assignee:"Előd Barna Bodó",status:"todo",priority:"normal",category:"Infrastruktúra",due:"",tags:[],private:false};openModal(`<div class="dialog-head"><h2>${task?esc(t("edit")):esc(t("newTask"))}</h2><button class="close" data-close aria-label="${esc(t("close"))}">×</button></div><form id="taskForm" class="dialog-body"><div class="form-grid"><div class="field full"><label>${esc(t("taskTitle"))} *</label><input name="title" required maxlength="120" value="${esc(x.title)}" placeholder="${lang==="hu"?"Például: Fő utcai járdajavítás ütemezése":"De exemplu: Planificarea reparării trotuarului"}"></div><div class="field full"><label>${esc(t("description"))}</label><textarea name="description">${esc(x.description)}</textarea></div><div class="field"><label>${esc(t("project"))}</label><select name="project">${projects.map(p=>`<option ${x.project===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>${esc(t("owner"))}</label><select name="assignee"><option value="">${esc(t("noAssignee"))}</option>${people.map(p=>`<option ${x.assignee===p.name?"selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>${esc(t("dueDate"))}</label><input name="due" type="date" value="${esc(x.due)}"></div><div class="field"><label>${esc(t("status"))}</label><select name="status">${["todo","progress","waiting","done"].map(s=>`<option value="${s}" ${x.status===s?"selected":""}>${esc(sLabel(s))}</option>`).join("")}</select></div><div class="field"><label>${esc(t("priority"))}</label><select name="priority">${["low","normal","high","urgent"].map(p=>`<option value="${p}" ${x.priority===p?"selected":""}>${esc(pLabel(p))}</option>`).join("")}</select></div><div class="field"><label>${esc(t("category"))}</label><select name="category">${["Infrastruktúra","Közintézmények","Pályázatok","Közterület","Kommunikáció","Belső működés"].map(c=>`<option ${x.category===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div><div class="field full"><label>${esc(t("tags"))}</label><input name="tags" value="${esc(x.tags.join(", "))}" placeholder="${lang==="hu"?"vesszővel elválasztva":"separate prin virgulă"}"></div><div class="field full"><label style="display:flex;align-items:center;gap:8px;font-weight:500"><input name="private" type="checkbox" ${x.private?"checked":""} style="width:auto">${esc(t("personal"))}</label></div></div><div class="dialog-actions"><button type="button" class="secondary" data-close>${esc(t("cancel"))}</button><button class="primary" type="submit">${esc(t("save"))}</button></div></form>`);document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);document.getElementById("taskForm").onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target);const title=String(fd.get("title")||"").trim();if(!title){toast(t("assigneeRequired"));return}const obj={id:task?task.id:Date.now(),title,description:String(fd.get("description")||"").trim(),project:String(fd.get("project")),assignee:String(fd.get("assignee")||""),status:String(fd.get("status")),priority:String(fd.get("priority")),category:String(fd.get("category")),due:String(fd.get("due")||""),tags:String(fd.get("tags")||"").split(",").map(a=>a.trim()).filter(Boolean),comments:task?task.comments:[],created:task?task.created:today(),private:fd.get("private")==="on",activity:task?"Előd frissítette a feladatot":"Előd létrehozta a feladatot"};if(task)state.tasks=state.tasks.map(a=>a.id===task.id?obj:a);else state.tasks.unshift(obj);persist();closeModal();toast(t("saved"));render()}}
    function openDetail(id){const x=state.tasks.find(a=>a.id===id);if(!x)return;const comments=x.comments||[];openModal(`<div class="dialog-head"><h2>${esc(t("tasks"))}</h2><div style="display:flex;gap:7px"><button class="secondary" id="editTask">${esc(t("edit"))}</button><button class="close" data-close aria-label="${esc(t("close"))}">×</button></div></div><div class="dialog-body"><h2 class="detail-headline">${esc(x.title)}</h2><p class="detail-desc">${esc(x.description||"—")}</p><div class="detail-grid"><div class="detail-cell"><div class="detail-label">${esc(t("status"))}</div><div class="detail-value">${badge(x.status)}</div></div><div class="detail-cell"><div class="detail-label">${esc(t("owner"))}</div><div class="detail-value">${esc(x.assignee||t("noAssignee"))}</div></div><div class="detail-cell"><div class="detail-label">${esc(t("dueDate"))}</div><div class="detail-value ${dueClass(x.due,x.status)}">${fmt(x.due)}</div></div><div class="detail-cell"><div class="detail-label">${esc(t("priority"))}</div><div class="detail-value priority-${x.priority}">${esc(pLabel(x.priority))}</div></div><div class="detail-cell"><div class="detail-label">${esc(t("project"))}</div><div class="detail-value">${esc(x.project)}</div></div><div class="detail-cell"><div class="detail-label">${esc(t("category"))}</div><div class="detail-value">${esc(x.category)}</div></div><div class="detail-cell"><div class="detail-label">${esc(t("tags"))}</div><div class="detail-value">${x.tags.map(esc).join(", ")||"—"}</div></div><div class="detail-cell"><div class="detail-label">${esc(t("history"))}</div><div class="detail-value">${esc(x.created||"—")}</div></div></div><section class="detail-section"><h3>${esc(t("comments"))}</h3>${comments.length?comments.map(c=>`<div class="comment-line"><strong>${esc(c.by)}:</strong> ${esc(c.text)}<div class="comment-time">${esc(c.time)}</div></div>`).join(""):`<div class="muted" style="font-size:11px">—</div>`}<form class="comment-form" id="commentForm"><input name="comment" placeholder="${esc(t("addComment"))}" maxlength="500" required><button class="primary" style="padding:8px 11px" type="submit">＋</button></form></section><section class="detail-section"><h3>${esc(t("history"))}</h3><div class="comment-line">${esc(x.activity||"Feladat létrehozva")}<div class="comment-time">${esc(x.updated||x.created)}</div></div></section><div class="notice">${esc(t("sensitiveNotice"))}</div></div>`);document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);document.getElementById("editTask").onclick=()=>openForm(x);document.getElementById("commentForm").onsubmit=e=>{e.preventDefault();const text=String(new FormData(e.target).get("comment")||"").trim();if(!text)return;x.comments.push({by:"Előd Barna Bodó",text,time:lang==="hu"?"Most":"Acum"});x.activity="Előd megjegyzést fűzött hozzá";x.updated=today();persist();toast(t("commentSaved"));openDetail(id)}}
    function bindGlobal(){document.getElementById("langToggle").onclick=()=>{lang=lang==="hu"?"ro":"hu";document.documentElement.lang=lang;render()};document.getElementById("modal").onclick=e=>{if(e.target.id==="modal"||e.target.closest("[data-close]"))closeModal()};document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});document.getElementById("helpBtn").onclick=()=>openModal(`<div class="dialog-head"><h2>${esc(t("signIn"))}</h2><button class="close" data-close aria-label="${esc(t("close"))}">×</button></div><div class="dialog-body"><p style="font-size:12px;color:var(--muted)">${esc(t("noConnection"))}</p><p style="font-size:13px;color:var(--muted)">${esc(t("sensitiveNotice"))}</p><button class="secondary" data-reset-demo style="width:100%">↺ ${esc(t("reset"))}</button><div class="dialog-actions"><button class="primary" data-close>${esc(t("close"))}</button></div></div>`);document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{quick=b.dataset.filter;filters={search:"",project:"",owner:"",status:""};setPage("tasks",true)});document.getElementById("menuBtn").onclick=()=>{const s=document.getElementById("sidebar");s.style.display=s.style.display==="flex"?"none":"flex";s.style.position="fixed";s.style.zIndex="15";s.style.width="250px";s.style.inset="0 auto 0 0"};document.addEventListener("click",e=>{if(e.target.closest("[data-action=invite]")){toast(lang==="hu"?"A tagmeghívás a valódi verzióban lesz elérhető.":"Invitarea membrilor va fi disponibilă în versiunea reală.")}if(e.target.closest("[data-reset-demo]")){closeModal();window.resetDemo()}})}
    document.getElementById("resetDemo")?.addEventListener("click",()=>{});
    bindGlobal();render();
    window.addEventListener("storage",()=>{state=load();render()});
    window.resetDemo=()=>{if(confirm(t("resetConfirm"))){state={tasks:structuredClone(seedTasks),projects:structuredClone(seedProjects),people:structuredClone(seedPeople)};projects=state.projects;people=state.people;persist();filters={search:"",project:"",owner:"",status:""};quick="";page="overview";render();toast(t("resetDone"))}};
    
  })();
  </script>
</body>
</html>
